name: SmartInterview CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartinterview
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartinterview

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit & integration test suites
        run: npm test
        env:
          SESSION_SECRET: ci-build-placeholder-session-secret-minimum-32-chars

      - name: Production Next.js build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smartinterview
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/smartinterview
          SESSION_SECRET: ci-build-placeholder-session-secret-minimum-32-chars
